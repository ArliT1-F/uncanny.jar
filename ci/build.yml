# Copy this file to .github/workflows/build.yml to have it run on push.
#
# It is stored here rather than in .github/workflows because this branch is
# pushed by an automation token that does not have permission to create workflow
# files. Moving it into place is a one-time, human-made change.

name: build

on:
  push:
    branches: [ "**" ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build
        run: ./gradlew build --stacktrace

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: uncanny
          path: build/libs/*.jar

  static-checks:
    # Runs the dependency-free checks. These do not need Minecraft, so they work
    # anywhere, including a fresh clone with no Gradle cache.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install tree-sitter tree-sitter-java
      - run: python3 tools/check_project.py

name: build

on:
  push:
    branches: [ "**" ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build
        run: ./gradlew build --stacktrace

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: uncanny
          path: build/libs/*.jar

  static-checks:
    # Runs the dependency-free checks. These do not need Minecraft, so they work
    # anywhere, including a fresh clone with no Gradle cache.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install tree-sitter tree-sitter-java
      - run: python3 tools/check_project.py

  server-smoke:
    # Boots a dedicated server with the mod installed and greps the log for the
    # director's own startup lines. No player, no world interaction: this proves
    # registration, config load, tick wiring and the heartbeat, nothing more.
    # Player-dependent behaviour is checked by hand - see docs/TESTING.md.
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Prepare a test server
        run: |
          mkdir -p run/config
          echo "eula=true" > run/eula.txt
          cat > run/config/uncanny.json <<'EOF'
          {
            "enabled": true,
            "debugLogging": true,
            "gracePeriodMinutes": 0,
            "devForceCommands": true,
            "eventCheckIntervalTicks": 40
          }
          EOF

      - name: Run the server for 10 minutes
        run: timeout 600 ./gradlew runServer --no-daemon > server.log 2>&1 || true

      - name: Check the log
        run: |
          echo "---- log tail ----"
          tail -n 60 server.log
          echo "-------------------"
          grep -q "anomalies registered" server.log
          grep -q "event director active, checking every" server.log
          grep -q "heartbeat: ok" server.log

      - name: Upload the server log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: server-log
          path: server.log
          if-no-files-found: ignore
